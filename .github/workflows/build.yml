name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build dependencies (Fyne / CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgl1-mesa-dev libglfw3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxxf86vm-dev \
            libgtk-3-dev
          sudo ldconfig
          test -e /usr/lib/x86_64-linux-gnu/libXxf86vm.so || { ls -la /usr/lib/x86_64-linux-gnu/libXxf86vm*; exit 1; }

      - name: Build desktop-otp (Linux)
        env:
          CGO_ENABLED: "1"
          # Help gcc/ld find shared libs (go-gl/glfw uses -lXxf86vm on X11)
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/desktop-otp ./cmd/otp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-otp-linux-amd64
          path: dist/desktop-otp
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up MSYS2 (MinGW gcc for Fyne CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glfw

      - name: Build otp.exe
        env:
          CGO_ENABLED: "1"
        run: |
          $goBin = Split-Path (Get-Command go).Source
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$goBin;$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2\mingw64\lib\pkgconfig"
          gcc --version
          go version
          go env CGO_ENABLED CC
          # Single-quoted -ldflags so PowerShell does not treat -H as its own switch.
          go build -trimpath -ldflags '-s -w -H windowsgui' -o otp.exe ./cmd/otp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-windows-amd64
          path: otp.exe
          if-no-files-found: error
