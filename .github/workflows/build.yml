name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build dependencies (Fyne / CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            xorg-dev \
            libgl1-mesa-dev libglfw3-dev libgtk-3-dev
          sudo ldconfig
          ls -la /usr/lib/x86_64-linux-gnu/libXxf86vm* 2>/dev/null || true

      - name: Build desktop-otp (Linux)
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then
            BRANCH="${GITHUB_REF_NAME:-unknown}"
          fi
          go build -trimpath -ldflags "-s -w -X desctop-otp/internal/buildinfo.Version=${VERSION} -X desctop-otp/internal/buildinfo.BuildDate=${BUILD_DATE} -X desctop-otp/internal/buildinfo.Branch=${BRANCH}" -o dist/desktop-otp ./cmd/otp 2>&1 | tee build-linux.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build-linux.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-otp-linux-amd64
          path: dist/desktop-otp
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up MSYS2 (MinGW gcc for Fyne CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glfw

      - name: Build otp.exe
        env:
          CGO_ENABLED: "1"
        run: |
          $goBin = Split-Path (Get-Command go).Source
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$goBin;$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2\mingw64\lib\pkgconfig"
          gcc --version
          go version
          go env CGO_ENABLED CC
          go run ./cmd/genico -out build/windows/app.ico -icongo internal/app/icon.go
          go install github.com/akavel/rsrc@v0.10.2
          & "$(go env GOPATH)/bin/rsrc.exe" -ico build/windows/app.ico -o cmd/otp/rsrc.syso
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $branch = (git rev-parse --abbrev-ref HEAD 2>$null)
          if (-not $branch) { $branch = $env:GITHUB_REF_NAME }
          if (-not $branch) { $branch = "unknown" }
          go build -trimpath -ldflags "-s -w -H windowsgui -X desctop-otp/internal/buildinfo.Version=$version -X desctop-otp/internal/buildinfo.BuildDate=$buildDate -X desctop-otp/internal/buildinfo.Branch=$branch" -o otp.exe ./cmd/otp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-windows-amd64
          path: otp.exe
          if-no-files-found: error
