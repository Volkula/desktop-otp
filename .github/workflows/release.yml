name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up MSYS2 (MinGW gcc for Fyne CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glfw

      - name: Build otp.exe
        env:
          CGO_ENABLED: "1"
        run: |
          $goBin = Split-Path (Get-Command go).Source
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$goBin;$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2\mingw64\lib\pkgconfig"
          go build -trimpath -ldflags '-s -w -H windowsgui' -o otp.exe ./cmd/otp

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: otp.exe
          generate_release_notes: true
