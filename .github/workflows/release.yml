name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up MSYS2 (MinGW gcc for Fyne CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glfw

      - name: Build otp.exe
        env:
          CGO_ENABLED: "1"
        run: |
          $goBin = Split-Path (Get-Command go).Source
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$goBin;$msys2\mingw64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys2\mingw64\lib\pkgconfig"
          go build -trimpath -ldflags '-s -w -H windowsgui' -o otp.exe ./cmd/otp

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: otp.exe
          generate_release_notes: true

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build dependencies (Fyne / CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev libglfw3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgtk-3-dev

      - name: Build Linux binary
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/desktop-otp ./cmd/otp

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Package .deb and .rpm
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/ --version "$VERSION"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/ --version "$VERSION"
          ls -la dist/

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          generate_release_notes: false
